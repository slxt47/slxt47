# Hält das Profil aktuell: jeden Tag Diagramme (assets/*.svg) und Projekt-Tabelle im README neu erzeugen,
# committen nur, wenn sich etwas geändert hat. Manuell: Actions → „Profil aktualisieren“ → Run workflow.
name: Profil aktualisieren
on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:
  push:
    paths: ["scripts/**", ".github/workflows/statistik.yml"]
permissions:
  contents: write
concurrency:
  group: profil
  cancel-in-progress: false
jobs:
  profil:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Diagramme erzeugen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/statistik.py
      - name: Projekt-Tabelle erzeugen
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python scripts/projekte.py
      - name: Committen, falls geändert
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets README.md
          git diff --cached --quiet || (git commit -m "Profil aktualisiert" && git push)
